[project]
name = "mirofish-backend"
version = "0.1.0"
description = "MicroFish - Concise universal swarm intelligence engine, predict everything"
requires-python = ">=3.11"
license = { text = "PROPRIETARY" }
authors = [
    { name = "Private Project" }
]

dependencies = [
    # Core framework
    "flask>=3.1.3",
    "flask-cors>=6.0.0",
    
    # LLM related
    "openai>=1.0.0",
    
    # Zep Cloud
    "zep-cloud==3.13.0",
    
    # File processing
    "PyMuPDF>=1.24.0",
    # Encoding detection (supports non-UTF-8 text files)
    "charset-normalizer>=3.0.0",
    "chardet>=5.0.0",
    
    # Utilities
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pipreqs>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",  # macOS ARM (M1/M2)
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",  # macOS Intel
    "sys_platform == 'win32'",  # Windows
    "sys_platform == 'linux'",  # Linux
]
