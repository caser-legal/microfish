services:
  mirofish:
    image: ghcr.io/microfish/microfish:latest
    # Mirror for faster pulls (replace the address above if pulling is slow)
    # image: ghcr.nju.edu.cn/microfish/microfish:latest
    container_name: mirofish
    env_file:
      - .env
    ports:
      - "3000:3000"
      - "5001:5001"
    restart: unless-stopped
    volumes:
      - ./backend/uploads:/app/backend/uploads